<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>도스게임 실행 (심플)</title>
<script src="auth.js"></script>
<!-- js-dos v8 스타일시트 및 스크립트 (CDN) -->
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
#dos { width: 100%; height: 100%; }
#msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #ff8a8a; font: 16px/1.6 system-ui, "Malgun Gothic", sans-serif; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- 에뮬레이터가 출력될 영역 -->
<div id="dos"></div>
<div id="msg"></div>
<script>
// 주소 예: dosplay.html?f=wolf3d.jsdos  →  ROMS/DOS/wolf3d.jsdos 를 바로 실행
var f = new URLSearchParams(location.search).get("f") || "";
if (!f || /[\/\\]|\.\./.test(f)) {
  location.replace("roms.html?m=dosgame");
} else if (typeof Dos !== "function") {
  var m = document.getElementById("msg");
  m.style.display = "flex";
  m.textContent = "js-dos 를 불러오지 못했어요.\n(v8.js-dos.com 접속 확인)";
} else {
  document.title = f.replace(/\.[^.]+$/, "") + " · 도스게임";
  Dos(document.getElementById("dos"), {
    url: "ROMS/DOS/" + encodeURIComponent(f),
    autoStart: true,  // 페이지 접속 시 자동 실행
    kiosk: false      // true로 설정 시 사이드바 설정 메뉴 숨김
  });
}
</script>
</body>
</html>
