<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>게임 실행 (js-dos)</title>
<script src="auth.js"></script>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,"Malgun Gothic",sans-serif}
#dos{width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#dbe7ff;background:#050b1e;z-index:20;white-space:pre-wrap;line-height:1.6;font-size:16px}
#ov.err{color:#ff9a9a}
#pb{width:min(420px,80vw);height:12px;background:#16264f;border-radius:8px;overflow:hidden}
#pb i{display:block;height:100%;width:0;background:#1e6bff;transition:width .15s}
#pick{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;width:min(480px,90vw)}
#pick button,#back{font:inherit;color:#fff;background:#1e6bff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;text-decoration:none}
#back{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:30;opacity:.55;padding:6px 12px;font-size:14px}
#back:hover{opacity:1}
</style>
</head>
<body>
<a id="back" href="index.html">← 목록</a>
<div id="dos"></div>
<div id="ov"><div id="tx">준비 중…</div><div id="pb"><i></i></div></div>
<script src="romdata.js"></script>
<script src="jsdoslib.js"></script>
<script src="dospad.js"></script>
<script>
(function(){
var q = new URLSearchParams(location.search), mid = q.get('m') || 'dosgame', f = q.get('f') || '';
var M = (typeof RD !== 'undefined' && RD.M[mid]) || {f:'DOS'}, folder = M.f || 'DOS'; if (q.get('s')) folder = folder + '/ROMS/' + folder;
var ov = document.getElementById('ov'), tx = document.getElementById('tx'), pb = ov.querySelector('#pb i');
document.getElementById('back').href = 'roms.html?m=' + encodeURIComponent(mid);

function show(t, err){ ov.style.display = 'flex'; ov.className = err ? 'err' : ''; tx.textContent = t; if (err) document.getElementById('pb').style.display = 'none'; }
function fail(e){ console.error(e); show('실행하지 못했어요.\n\n' + (e && e.message || e), true); }
function loadScript(u){ return new Promise(function(ok, no){ var s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function needZip(){
  if (window.JSZip) return;
  var urls = ['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'];
  for (var i = 0; i < urls.length; i++){ try { await loadScript(urls[i]); if (window.JSZip) return; } catch(e){} }
  throw new Error('ZIP 라이브러리(JSZip)를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
}
function mb(n){ return (n / 1048576).toFixed(1) + 'MB'; }

/* 진행률(퍼센트·남은 시간)을 보여주며 내려받기 */
async function getBuf(url, label){
  var r = await fetch(url);
  if (!r.ok) throw new Error(label + ' 파일을 찾을 수 없어요 (' + r.status + ')\n' + url);
  var total = +r.headers.get('content-length') || 0;
  if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
  var rd = r.body.getReader(), chunks = [], got = 0, t0 = Date.now();
  for (;;){
    var x = await rd.read(); if (x.done) break;
    chunks.push(x.value); got += x.value.length;
    var sec = (Date.now() - t0) / 1000, left = (total && got) ? Math.max(0, Math.round(sec * (total - got) / got)) : 0;
    tx.textContent = label + ' 내려받는 중…\n' + mb(got) + (total ? ' / ' + mb(total) + '  (' + Math.floor(got * 100 / total) + '%' + (left ? ', 약 ' + left + '초 남음' : '') + ')' : '');
    pb.style.width = total ? (got * 100 / total) + '%' : '50%';
  }
  var out = new Uint8Array(got), p = 0;
  chunks.forEach(function(c){ out.set(c, p); p += c.length; });
  return out;
}

function choose(list){
  return new Promise(function(ok){
    ov.className = ''; document.getElementById('pb').style.display = 'none';
    tx.textContent = '시작할 파일을 골라주세요.';
    var box = document.createElement('div'); box.id = 'pick';
    list.slice(0, 40).forEach(function(n){ var b = document.createElement('button'); b.textContent = n; b.onclick = function(){ box.remove(); document.getElementById('pb').style.display = ''; ok(n); }; box.appendChild(b); });
    ov.appendChild(box);
  });
}

async function main(){
  if (!f || /[\/\\]|\.\./.test(f)) { location.replace('roms.html?m=' + encodeURIComponent(mid)); return; }
  document.title = f.replace(/\.[^.]+$/, '') + ' · 게임 실행';
  if (typeof Dos !== 'function') throw new Error('js-dos 를 불러오지 못했어요.\n(v8.js-dos.com 접속을 확인해주세요)');
  await needZip();

  var buf = await getBuf('ROMS/' + folder + '/' + encodeURIComponent(f), '게임');
  show('게임 파일 여는 중…');
  var zip, names, listNames = function(){ return Object.keys(zip.files).filter(function(n){ return !zip.files[n].dir; }); };
  if (/\.(img|ima|vhd|iso)$/i.test(f)){            /* 디스크 이미지 한 파일을 그대로 올린 경우 */
    zip = new JSZip(); zip.file(f, buf);
  } else {
    zip = await JSZip.loadAsync(buf);
  }
  names = listNames();
  var rebuilt = false;
  /* zip 안에 .jsdos / .zip 이 또 들어 있는 경우(예: 게임.jsdos 를 zip 으로 한 번 더 압축) → 안쪽 것을 꺼내서 사용 */
  for (var depth = 0; depth < 3; depth++){
    var real = names.filter(function(n){ return !/^\.jsdos\//i.test(n); });
    var inner = real.filter(function(n){ return /\.(jsdos|zip)$/i.test(n); });
    var runnable = real.some(function(n){ return /\.(exe|com|bat|img|ima|vhd|iso)$/i.test(n); }) || names.some(function(n){ return /(^|\/)\.jsdos\/dosbox\.conf$/i.test(n); });
    if (inner.length === 1 && !runnable){
      show('압축 안의 게임 파일 여는 중…\n' + inner[0]);
      buf = await zip.file(inner[0]).async('uint8array');
      zip = await JSZip.loadAsync(buf); names = listNames(); rebuilt = false;
    } else break;
  }
  /* 게임 폴더째로 압축해서 .jsdos 설정이 한 단계 아래 폴더에 들어간 경우 → 그 폴더를 바깥으로 꺼냄 */
  if (!zip.file('.jsdos/dosbox.conf')){
    var cn = names.filter(function(n){ return /^[^\/]+\/\.jsdos\/dosbox\.conf$/i.test(n); });
    if (cn.length === 1){
      var pre = cn[0].slice(0, cn[0].indexOf('/') + 1), nz = new JSZip();
      for (var k = 0; k < names.length; k++) if (names[k].indexOf(pre) === 0) nz.file(names[k].slice(pre.length), await zip.file(names[k]).async('uint8array'));
      zip = nz; names = listNames(); rebuilt = true;
    }
  }
  if (rebuilt) buf = await zip.generateAsync({type: 'uint8array'});

  var meta = {}, mf = zip.file('.jsdos/gw.json');
  if (mf) { try { meta = JSON.parse(await mf.async('string')); } catch(e){} }

  var conf = null, cf = zip.file('.jsdos/dosbox.conf');
  if (cf) conf = await cf.async('string');

  /* 설정이 없는 평범한 zip → 자동으로 설정 만들기 */
  var bootDisk = null;
  if (!conf){
    var ents0 = names.map(function(n){ return {name: n, size: (zip.files[n]._data && zip.files[n]._data.uncompressedSize) || 0}; });
    var disk = GWJ.pickDisk(ents0), anyExe = GWJ.pickExes(names, 'win').length > 0;
    var w = GWJ.findWin31(names);
    if (disk && !anyExe){
      /* 디스크 이미지(.img/.iso) 가 든 zip → 이미지를 그대로 부팅 */
      var dbytes = await zip.file(disk.name).async('uint8array');
      var dk = GWJ.diskKind(disk.name, dbytes.length);
      if (dk === 'hdd') dbytes = GWJ.stripVhd(dbytes);
      bootDisk = {name: disk.name.split('/').pop(), full: disk.name, bytes: dbytes, kind: dk};
      conf = GWJ.diskConf(bootDisk.name, dbytes.length, dk);
      meta.kind = dk === 'hdd' ? 'win95' : 'dos';
    } else if (mid === 'win95game' && !w && anyExe){
      /* 윈도우 95 폴더의 일반 zip → 공용 윈도우 95 이미지로 부팅하고 게임 폴더를 D 드라이브로 붙임 */
      var xl = GWJ.pickExes(names, 'win'), xx = xl.length === 1 ? xl[0] : await choose(xl);
      var gb = 0; names.forEach(function(n){ gb += (zip.files[n]._data && zip.files[n]._data.uncompressedSize) || 0; });
      meta.kind = 'win95'; meta.base = 'win95'; meta.launch = 'gametxt'; meta.exe = xx; meta.drive = 'D'; meta.gameBytes = gb;
      conf = '@@WIN95GAME@@';
    } else if (w){
      meta.kind = 'win31';
      var wl = GWJ.pickExes(names, 'win'), wx = wl.length === 1 ? wl[0] : (wl.length ? await choose(wl.concat(['(프로그램 관리자만 열기)'])) : '');
      conf = GWJ.win31Conf(w, /^\(/.test(wx) ? '' : wx);
    } else {
      var dl = GWJ.pickExes(names, 'dos');
      if (!dl.length) throw new Error('zip 안에서 실행 파일(.exe .com .bat)을 찾지 못했어요.\n변환기로 .jsdos 를 만들어 올려주세요.');
      var dx = dl.length === 1 ? dl[0] : await choose(dl);
      conf = GWJ.dosConf(dx);
    }
  }

  var opts = GWJ.jsdosOptions(meta, !!meta.base);
  var uiMode = GWPad.init({root: '#dos', win: meta.kind === 'win31' || meta.kind === 'win95'});
  opts.onEvent = function (ev, arg) { if (ev === 'ci-ready') GWPad.setCI(arg); };
  if (uiMode === 'mobile') { opts.noSideBar = true; }
  var el = document.getElementById('dos');

  var gametxt = meta.kind === 'win95' && meta.launch === 'gametxt' && meta.exe;
  if (meta.base || !cf || gametxt){
    /* 방식 B: 설정 + 파일들을 직접 넘김 (공용 윈도우 이미지 / 설정 없는 zip / 게임 자동실행 기록) */
    var files = [], imgPath = null, imgBytes = null;
    if (meta.base){
      var bz = await getBuf(GWJ.baseUrl(meta.base), '윈도우 이미지');
      show('윈도우 이미지 여는 중…\n(처음에는 시간이 걸릴 수 있어요)');
      var bzip = await JSZip.loadAsync(bz); bz = null;
      var ents = Object.keys(bzip.files).map(function(n){ return {name: n, size: (bzip.files[n]._data && bzip.files[n]._data.uncompressedSize) || 0, dir: bzip.files[n].dir}; }).filter(function(e){ return !e.dir; });
      var img = GWJ.pickImage(ents);
      if (!img) throw new Error('os/' + meta.base + '/' + meta.base + '.zip 안에서 디스크 이미지(.img)를 찾지 못했어요.');
      imgPath = 'win95.img';
      imgBytes = GWJ.stripVhd(await bzip.file(img.name).async('uint8array'));
      bzip = null;
      if (conf === '@@WIN95GAME@@') conf = GWJ.win95GameConf('win95.img', imgBytes.length, meta.gameBytes || 0);
    } else if (bootDisk){
      imgPath = bootDisk.name; imgBytes = bootDisk.bytes;
    } else if (gametxt){
      var ie = names.map(function(n){ return {name: n, size: (zip.files[n]._data && zip.files[n]._data.uncompressedSize) || 0}; });
      var own = GWJ.pickImage(ie);
      if (own){ imgPath = own.name; imgBytes = await zip.file(own.name).async('uint8array'); }
    }
    if (imgBytes && gametxt){
      var okp = GWJ.patchGameTxt(imgBytes, GWJ.gameTxtFor(meta.exe, meta.drive || 'D'));
      if (!okp) console.warn('GAME.TXT 를 바꾸지 못했어요. 윈도우 안에서 게임을 직접 실행하세요.');
    }
    if (imgBytes) files.push({path: imgPath, contents: imgBytes});
    imgBytes = null;
    for (var i = 0; i < names.length; i++){
      if (/^\.jsdos\//i.test(names[i]) || names[i] === imgPath || (bootDisk && names[i] === bootDisk.full)) continue;
      tx.textContent = '파일 준비 중… ' + (i + 1) + ' / ' + names.length; pb.style.width = ((i + 1) * 100 / names.length) + '%';
      files.push({path: names[i], contents: await zip.file(names[i]).async('uint8array')});
    }
    opts.dosboxConf = conf; opts.initFs = files;
  } else {
    /* 방식 A: 번들 그대로 */
    opts.url = URL.createObjectURL(new Blob([buf], {type: 'application/zip'}));
  }
  buf = null;
  ov.style.display = 'none';
  Dos(el, opts);
  setTimeout(GWPad.focus, 800);
}
main().catch(fail);
})();
</script>
</body>
</html>
