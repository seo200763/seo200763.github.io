<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>플래시게임</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#wrap ruffle-player,#wrap ruffle-embed{width:100%;height:100%;display:block}
.tb{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));z-index:9;display:flex;gap:6px;transition:opacity .3s}
.tb button{border:0;border-radius:20px;background:#000a;color:#fff;padding:8px 14px;font-size:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tb.hide{opacity:0;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;line-height:1.7;color:#ccc;pointer-events:none}
#msg b{color:#ff6a6a}
/* 가상 키패드 (터치 기기용) */
#pad{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;justify-content:space-between;align-items:flex-end;padding:10px 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
#pad.on{display:flex}
#pad .g{display:grid;gap:8px;pointer-events:none}
#pad .dp{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
#pad .ab{grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px)}
#pad button{pointer-events:auto;border:1px solid #fff5;border-radius:50%;background:#0006;color:#fff;font-size:18px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#pad button:active,#pad button.dn{background:#ff5a5acc}
#pad .dp button{border-radius:14px}
</style></head><body>
<div id="wrap"></div>
<div id="msg">플래시 에뮬레이터 불러오는 중…</div>
<div class="tb" id="tb"><button id="bk">← 목록</button><button id="rs">↻ 다시시작</button><button id="fs">⛶ 전체화면</button><button id="kp">🎮 가상키</button></div>
<div id="pad"><div class="g dp" id="dp"></div><div class="g ab" id="ab"></div></div>
<script src="common.js"></script><script>
const q=new URLSearchParams(location.search),f=q.get('f');
const url=f?RAW('ROMFILE/SWF/'+f):null;
const msg=t=>{$('#msg').innerHTML=t};
$('#bk').onclick=()=>history.length>1?history.back():location.href='index.html';
document.title=f?f.replace(/\.[^.]+$/,''):'플래시게임';

/* ── Ruffle 불러오기: 내 사이트의 ruffle/ruffle.js 가 있으면 우선, 없으면 CDN ── */
const SRC=['ruffle/ruffle.js','https://unpkg.com/@ruffle-rs/ruffle','https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle'];
function loadRuffle(i=0){return new Promise((ok,no)=>{
 if(window.RufflePlayer&&RufflePlayer.newest)return ok();
 if(i>=SRC.length)return no(Error('Ruffle 로드 실패'));
 const s=document.createElement('script');s.src=SRC[i];
 s.onload=()=>window.RufflePlayer?ok():loadRuffle(i+1).then(ok,no);
 s.onerror=()=>{s.remove();loadRuffle(i+1).then(ok,no)};
 document.head.appendChild(s)})}

let player=null;
function start(){
 if(player){player.remove();player=null}
 const r=RufflePlayer.newest();player=r.createPlayer();$('#wrap').appendChild(player);
 player.load({url,autoplay:'auto',unmuteOverlay:'visible',letterbox:'on',splashScreen:false,
  contextMenu:'rightClickOnly',allowScriptAccess:false,quality:'high',backgroundColor:'#000000',
  warnOnUnsupportedContent:false,openUrlMode:'confirm'}).then(()=>msg('')).catch(e=>msg('<b>실행 실패</b><br>'+(e&&e.message||e)+'<br>(지원되지 않는 SWF 이거나 파일을 찾을 수 없습니다)'));
 msg('');
}
if(!url){msg('<b>실행할 수 없는 게임입니다.</b>')}
else loadRuffle().then(start).catch(()=>msg('<b>플래시 에뮬레이터(Ruffle)를 불러오지 못했습니다.</b><br>인터넷 연결을 확인해 주세요.<br><small>오프라인 사용: ruffle 파일을 사이트의 ruffle/ 폴더에 넣으면 됩니다.</small>'));

$('#rs').onclick=()=>{if(window.RufflePlayer&&url)start()};
$('#fs').onclick=()=>{const e=document.documentElement;(document.fullscreenElement?document.exitFullscreen():(e.requestFullscreen||e.webkitRequestFullscreen||(()=>toast('이 브라우저는 전체화면을 지원하지 않습니다'))).call(e))};

/* ── 가상 키패드: 방향키 + Space / Z / X / Enter 를 키보드 이벤트로 전달 ── */
const KEYS={ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,' ':32,z:90,x:88,Enter:13};
function fire(type,k){const code=k==' '?'Space':/^[a-z]$/.test(k)?'Key'+k.toUpperCase():k;
 const ev={key:k,code,keyCode:KEYS[k],which:KEYS[k],bubbles:true,cancelable:true};
 const t=player||document;[t,window].forEach(x=>{try{const e=new KeyboardEvent(type,ev);try{Object.defineProperty(e,'keyCode',{get:()=>KEYS[k]});Object.defineProperty(e,'which',{get:()=>KEYS[k]})}catch(_){}x.dispatchEvent(e)}catch(_){}})}
function mk(box,list){list.forEach(([lab,k])=>{const b=document.createElement('button');if(!k){b.style.visibility='hidden';b.disabled=true}else{b.textContent=lab;
  const dn=e=>{e.preventDefault();b.classList.add('dn');fire('keydown',k)},up=e=>{e.preventDefault();b.classList.remove('dn');fire('keyup',k)};
  b.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,e=>{if(b.classList.contains('dn'))up(e)}))}
 box.appendChild(b)})}
mk($('#dp'),[['',0],['▲','ArrowUp'],['',0],['◀','ArrowLeft'],['',0],['▶','ArrowRight'],['',0],['▼','ArrowDown'],['',0]]);
mk($('#ab'),[['Z','z'],['X','x'],['␣',' '],['↵','Enter']]);
$('#kp').onclick=()=>$('#pad').classList.toggle('on');
if(matchMedia('(pointer:coarse)').matches)$('#pad').classList.add('on');

/* 툴바는 잠시 후 자동으로 숨김, 화면을 건드리면 다시 나타남 */
let hh;const showTb=()=>{$('#tb').classList.remove('hide');clearTimeout(hh);hh=setTimeout(()=>$('#tb').classList.add('hide'),3500)};
['pointermove','pointerdown','keydown'].forEach(n=>window.addEventListener(n,showTb,{passive:true}));showTb();
</script></body></html>
