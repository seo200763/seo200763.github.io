<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4aa8ff">
<title>최영호의 개인공간 · 로그인</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
body{background:#5db4ff url(login/bg.jpg) center/cover no-repeat fixed;display:flex;align-items:center;justify-content:center;padding:16px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);pointer-events:none}

/* ===== 유리(투명) 로그인창 ===== */
.panel{position:relative;width:min(700px,94vw);padding:clamp(22px,4.2vw,38px) clamp(20px,5.5vw,56px) clamp(24px,4.4vw,40px);border-radius:14px;
 background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(190,225,255,.20) 55%,rgba(255,255,255,.26));
 border:2px solid rgba(255,255,255,.62);
 box-shadow:0 10px 40px rgba(20,90,200,.28),inset 0 0 28px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.8);
 -webkit-backdrop-filter:blur(7px) saturate(1.25);backdrop-filter:blur(7px) saturate(1.25);text-align:center;transition:opacity .5s,transform .5s}
.panel.go{opacity:0;transform:scale(1.04)}
.hello{margin:0 0 clamp(6px,1.4vw,10px);font-size:clamp(11px,2.2vw,14px);font-weight:700;color:#14529f;text-shadow:0 0 6px #fff,0 0 3px #fff;letter-spacing:-.2px}
.title{margin:0 0 clamp(16px,3.2vw,28px);font-size:clamp(26px,6.2vw,46px);line-height:1.22;font-weight:900;letter-spacing:-1px;color:#0b63e5;
 text-shadow:0 0 2px #fff,0 0 8px rgba(255,255,255,.95),0 2px 10px rgba(0,80,220,.35);-webkit-text-stroke:1.1px #0b63e5;paint-order:stroke fill}
.field{position:relative;margin:0 auto clamp(14px,2.8vw,24px);width:100%}
.field input{width:100%;height:clamp(46px,8.4vw,62px);padding:0 clamp(46px,8vw,64px) 0 clamp(14px,2.6vw,20px);font:700 clamp(18px,3.4vw,24px) "Malgun Gothic",system-ui,sans-serif;letter-spacing:4px;color:#0b3d91;
 background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(226,242,255,.88));border:2px solid #3b8cf0;border-radius:14px;outline:none;
 box-shadow:inset 0 2px 6px rgba(40,110,220,.18),0 0 0 3px rgba(255,255,255,.35)}
.field input:focus{border-color:#0a6cff;box-shadow:inset 0 2px 6px rgba(40,110,220,.18),0 0 0 4px rgba(80,160,255,.45),0 0 16px rgba(80,160,255,.6)}
.field input::placeholder{letter-spacing:0;font-weight:600;color:#7b9cc8}
.field .lock{position:absolute;right:clamp(12px,2.4vw,18px);top:50%;width:clamp(22px,4vw,30px);height:clamp(22px,4vw,30px);transform:translateY(-50%);fill:#6b86a8;opacity:.92;cursor:pointer;background:none;border:0;padding:0}
.msg{min-height:22px;margin:-8px 0 8px;font-size:clamp(12px,2.4vw,15px);font-weight:800;color:#d8222a;text-shadow:0 0 5px #fff,0 0 3px #fff}
.msg.ok{color:#0a7a3c}
.row{display:flex;gap:clamp(10px,3vw,26px);justify-content:center}
.imgbtn{flex:1 1 0;max-width:260px;border:0;padding:0;margin:0;background-color:transparent;background-size:100% 100%;background-repeat:no-repeat;cursor:pointer;
 aspect-ratio:698/221;font-size:0;color:transparent;filter:drop-shadow(0 4px 8px rgba(0,70,200,.35));transition:transform .12s,filter .12s}
.imgbtn:hover{transform:translateY(-2px);filter:drop-shadow(0 6px 12px rgba(0,90,255,.5)) brightness(1.06)}
.imgbtn:active{transform:translateY(1px) scale(.98);filter:drop-shadow(0 2px 4px rgba(0,70,200,.4)) brightness(.95)}
.imgbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#btnLogin{background-image:url(login/btn-login.png)}
#btnFind{background-image:url(login/btn-find.png);aspect-ratio:696/221}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ===== 비밀번호 찾기 창 ===== */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,70,150,.30);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:5}
.modal.show{display:flex}
.card{position:relative;width:min(520px,94vw);max-height:92vh;overflow:auto;padding:26px clamp(18px,5vw,34px) 24px;border-radius:14px;text-align:center;
 background:linear-gradient(150deg,rgba(255,255,255,.80),rgba(215,236,255,.74));border:2px solid rgba(255,255,255,.85);box-shadow:0 14px 50px rgba(10,70,190,.4),inset 0 0 20px rgba(255,255,255,.6)}
.card h2{margin:0 0 6px;font-size:22px;font-weight:900;color:#0b55c4}
.card p{margin:0 0 14px;font-size:14px;line-height:1.55;color:#244c86;font-weight:600}
.card input{width:100%;height:46px;margin:0 0 10px;padding:0 14px;font:700 17px "Malgun Gothic",system-ui,sans-serif;color:#0b3d91;background:#fff;border:2px solid #3b8cf0;border-radius:12px;outline:none}
.card input:focus{border-color:#0a6cff;box-shadow:0 0 0 3px rgba(80,160,255,.45)}
.sbtn{height:44px;padding:0 20px;margin:4px 3px 0;font:800 15px "Malgun Gothic",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#4aa8ff,#0a62e8);border:2px solid #0a4fc0;border-radius:12px;cursor:pointer;box-shadow:0 3px 8px rgba(0,70,200,.3)}
.sbtn.sub{color:#0b55c4;background:linear-gradient(180deg,#fff,#cfe6ff);border-color:#5ea2f2}
.sbtn:active{transform:translateY(1px)}
.closeX{position:absolute;right:10px;top:8px;width:34px;height:34px;font:900 20px/1 Arial;color:#3a6fb8;background:none;border:0;cursor:pointer}
.cur{margin:0 0 12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.75);border:1.5px dashed #5ea2f2;font-size:16px;font-weight:800;color:#0b3d91}
.cur b{letter-spacing:3px;font-size:20px}
.cur button{margin-left:8px;height:30px;padding:0 10px;font:700 13px "Malgun Gothic";border:1.5px solid #5ea2f2;border-radius:8px;background:#fff;color:#0b55c4;cursor:pointer}
.code{display:none;margin:10px 0 0;padding:10px;text-align:left;font:12px/1.5 Consolas,monospace;word-break:break-all;color:#173a73;background:rgba(255,255,255,.85);border:1.5px solid #9cc4f5;border-radius:10px;user-select:all}
.small{margin-top:10px;font-size:12px;color:#456fa8;font-weight:600;line-height:1.5}
@media(max-height:520px){body{align-items:flex-start;overflow:auto}}
</style>
</head>
<body>
<main class="panel" id="panel">
  <p class="hello">최영호의 개인공간 · 접속을 원하시면 로그인을 하세요.</p>
  <h1 class="title">개인공간입니다.<br>암호를 입력하세요.</h1>

  <div class="field" id="field">
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="암호" autofocus>
    <button class="lock" id="eye" type="button" aria-label="암호 보기/숨기기" title="암호 보기/숨기기">
      <svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M17 9V7a5 5 0 0 0-10 0v2H5.5A1.5 1.5 0 0 0 4 10.5v10A1.5 1.5 0 0 0 5.5 22h13a1.5 1.5 0 0 0 1.5-1.5v-10A1.5 1.5 0 0 0 18.5 9H17zM9 7a3 3 0 0 1 6 0v2H9V7zm3 6.2a2 2 0 0 1 1 3.7V19h-2v-2.1a2 2 0 0 1 1-3.7z"/></svg>
    </button>
  </div>
  <div class="msg" id="msg" role="alert"></div>

  <div class="row">
    <button class="imgbtn" id="btnLogin" type="button" aria-label="로그인">로그인</button>
    <button class="imgbtn" id="btnFind" type="button" aria-label="비밀번호 찾기">비밀번호 찾기</button>
  </div>
</main>

<!-- 비밀번호 찾기 -->
<div class="modal" id="modal">
  <div class="card">
    <button class="closeX" id="mClose" type="button" aria-label="닫기">✕</button>
    <div id="stepA">
      <h2>🔑 비밀번호 찾기</h2>
      <p>복구 <b>토큰</b>을 입력하면 설정된 암호를 확인하거나 새 암호로 변경할 수 있어요.</p>
      <input id="tk" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="복구 토큰 (예: XXXX-XXXX-XXXX)">
      <div class="msg" id="tkMsg" style="margin:0 0 4px"></div>
      <button class="sbtn" id="tkOk" type="button">토큰 확인</button>
      <button class="sbtn sub" id="tkCancel" type="button">취소</button>
    </div>
    <div id="stepB" style="display:none">
      <h2>✅ 토큰 확인 완료</h2>
      <div class="cur">현재 암호: <b id="curPw">••••</b><button id="curBtn" type="button">보기</button></div>
      <p>암호를 바꾸려면 새 암호를 입력하세요.</p>
      <input id="np1" type="password" autocomplete="new-password" placeholder="새 암호 (4자 이상)">
      <input id="np2" type="password" autocomplete="new-password" placeholder="새 암호 한 번 더">
      <div class="msg" id="npMsg" style="margin:0 0 4px"></div>
      <button class="sbtn" id="npOk" type="button">암호 변경</button>
      <button class="sbtn sub" id="npDone" type="button">돌아가기</button>
      <div class="code" id="code"></div>
      <div class="small" id="codeHint" style="display:none">※ 변경은 <b>지금 이 기기·브라우저에만</b> 적용됩니다. 모든 기기에 적용하려면 위 코드로 <b>login-config.js</b>의 값을 교체해 올리세요.</div>
      <div class="small"><a href="#" id="resetDef" style="color:#2468c8">기본 설정으로 되돌리기</a></div>
    </div>
  </div>
</div>

<script src="sha256.js"></script>
<script src="login-config.js"></script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var SALT='cyh|',KEY_H='cyh_pw_hash',KEY_E='cyh_pw_enc';
var BASE=window.CYH_AUTH||{};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function curCfg(){return{pwHash:ls(KEY_H)||BASE.pwHash,pwEnc:ls(KEY_E)||BASE.pwEnc,tokenHash:BASE.tokenHash}}
var h=function(s){return cyhSha256(SALT+s)};

/* 로그아웃 상태로 시작 (나가기로 돌아오면 다시 로그인) */
try{sessionStorage.removeItem('cyh_auth')}catch(e){}

/* ----- 로그인 ----- */
var fails=0,lockUntil=0;
function say(t,ok){var m=$('msg');m.textContent=t||'';m.className='msg'+(ok?' ok':'')}
function doLogin(){
  var now=Date.now();
  if(now<lockUntil){say('잠시 후 다시 시도하세요 ('+Math.ceil((lockUntil-now)/1000)+'초)');return}
  var v=$('pw').value;
  if(!v){say('암호를 입력하세요.');$('pw').focus();return}
  if(h(v)===curCfg().pwHash){
    say('접속 중…',true);
    try{sessionStorage.setItem('cyh_auth','1')}catch(e){}
    $('panel').classList.add('go');
    setTimeout(function(){location.href='winemu.html'},420);
  }else{
    fails++;$('pw').value='';
    var f=$('field');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
    if(fails>=5){lockUntil=Date.now()+30000;fails=0;say('5회 틀렸습니다. 30초 후 다시 시도하세요.')}
    else say('암호가 올바르지 않습니다. ('+fails+'/5)');
    $('pw').focus();
  }
}
$('btnLogin').onclick=doLogin;
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
$('pw').addEventListener('input',function(){if($('msg').textContent)say('')});
$('eye').onclick=function(){var p=$('pw');p.type=p.type==='password'?'text':'password';p.focus()};

/* ----- 비밀번호 찾기 ----- */
var token='';
function openModal(){$('modal').classList.add('show');$('stepA').style.display='';$('stepB').style.display='none';$('tk').value='';$('tkMsg').textContent='';token='';setTimeout(function(){$('tk').focus()},50)}
function closeModal(){$('modal').classList.remove('show');token='';$('curPw').textContent='••••';$('np1').value=$('np2').value='';$('code').style.display='none';$('codeHint').style.display='none';$('pw').focus()}
$('btnFind').onclick=openModal;
$('mClose').onclick=$('tkCancel').onclick=$('npDone').onclick=closeModal;
$('modal').addEventListener('mousedown',function(e){if(e.target===$('modal'))closeModal()});
var tkFails=0,tkLock=0;
function checkToken(){
  if(Date.now()<tkLock){$('tkMsg').textContent='잠시 후 다시 시도하세요.';return}
  var t=$('tk').value.trim().toUpperCase();
  if(t&&h(t)===BASE.tokenHash){
    token=t;tkFails=0;$('stepA').style.display='none';$('stepB').style.display='';$('curPw').textContent='••••';$('curBtn').textContent='보기';$('np1').focus();
  }else{
    tkFails++;$('tkMsg').textContent='토큰이 올바르지 않습니다. ('+tkFails+'/5)';
    if(tkFails>=5){tkLock=Date.now()+60000;tkFails=0;$('tkMsg').textContent='5회 틀렸습니다. 1분 후 다시 시도하세요.'}
  }
}
$('tkOk').onclick=checkToken;
$('tk').addEventListener('keydown',function(e){if(e.key==='Enter')checkToken()});
$('curBtn').onclick=function(){
  var shown=$('curBtn').textContent==='숨김';
  if(shown){$('curPw').textContent='••••';$('curBtn').textContent='보기';return}
  var p=cyhDec(curCfg().pwEnc,token);
  $('curPw').textContent=p==null?'(확인 불가 – 새 암호로 변경하세요)':p;$('curBtn').textContent='숨김';
};
$('npOk').onclick=function(){
  var a=$('np1').value,b=$('np2').value,m=$('npMsg');
  if(a.length<4){m.textContent='암호는 4자 이상으로 입력하세요.';return}
  if(a!==b){m.textContent='두 암호가 서로 다릅니다.';return}
  var cfg={pwHash:h(a),tokenHash:BASE.tokenHash,pwEnc:cyhEnc(a,token)};
  ls(KEY_H,cfg.pwHash);ls(KEY_E,cfg.pwEnc);
  m.style.color='#0a7a3c';m.textContent='암호를 변경했습니다. 새 암호로 로그인하세요.';
  $('np1').value=$('np2').value='';$('curPw').textContent='••••';$('curBtn').textContent='보기';
  var c=$('code');c.style.display='block';
  c.textContent='window.CYH_AUTH='+JSON.stringify(cfg)+';';
  $('codeHint').style.display='';
};
$('resetDef').onclick=function(e){e.preventDefault();ls(KEY_H,null);ls(KEY_E,null);$('npMsg').style.color='#0a7a3c';$('npMsg').textContent='기본 설정으로 되돌렸습니다.';$('curPw').textContent='••••';$('curBtn').textContent='보기'};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modal').classList.contains('show'))closeModal()});
})();
</script>
</body>
</html>
