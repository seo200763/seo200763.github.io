<!DOCTYPE html>
<html lang="ko" data-dev="pc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d33">
<link rel="manifest" href="manifest.webmanifest">
<title>영호의 게임에뮬레이터 · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="ui/common.css">
<style>
body{display:grid;place-items:center;min-height:100dvh;padding:20px;background:#0b0d33 url(ui/img/login-bg.jpg) center/cover no-repeat fixed;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(5,6,40,.1),rgba(5,6,40,.55));pointer-events:none}
/* 픽셀 모서리 창 */
.px{--n:8px;clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)))}
.win{position:relative;z-index:1;width:min(1240px,100%);padding:4px;background:linear-gradient(135deg,#ff6bdf,#7a5cff 35%,#3ec9ff 70%,#b86bff);filter:drop-shadow(0 0 28px rgba(110,90,255,.55)) drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.win>.in{overflow:hidden;background:#101360}
.bar{display:flex;align-items:center;gap:14px;height:clamp(56px,8vw,84px);padding:0 24px;background:linear-gradient(90deg,#a14fe8,#5a4cf0 45%,#2fb4f5);border-bottom:3px solid rgba(255,255,255,.35)}
.bar svg{width:clamp(48px,6vw,76px);height:auto;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.bar b{font:900 clamp(20px,2.8vw,36px) var(--kr);letter-spacing:-.02em;text-shadow:0 2px 0 rgba(30,10,90,.45)}
.bar b .g{color:#ffb3f0;font-style:italic}
.body{display:grid;grid-template-columns:1fr 1.15fr;gap:0;align-items:stretch;padding:clamp(18px,3vw,44px);background:linear-gradient(rgba(10,12,60,.35),rgba(10,12,60,.55)),url(ui/img/panel-bg.jpg) center/cover}
.art{position:relative;display:grid;place-items:center;padding-right:clamp(10px,2.4vw,40px);border-right:2px solid rgba(140,150,255,.4)}
.art img{width:100%;max-width:520px;height:auto;display:block;border-radius:14px;-webkit-mask-image:radial-gradient(ellipse 92% 90% at 55% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 92% 90% at 55% 50%,#000 55%,transparent 100%);image-rendering:auto}
form{display:flex;flex-direction:column;gap:clamp(12px,1.8vw,20px);padding-left:clamp(10px,2.4vw,40px);justify-content:center}
.f{position:relative}
.f svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:26px;height:26px;fill:#e6e9ff}
.f:after{content:"";position:absolute;left:62px;top:24%;bottom:24%;width:1px;background:rgba(255,255,255,.22)}
.f input{width:100%;height:clamp(54px,6vw,70px);border-radius:16px;border:2px solid rgba(150,140,255,.7);background:rgba(10,10,52,.78);color:#fff;padding:0 18px 0 78px;font:500 clamp(15px,1.5vw,19px) var(--kr);outline:0;transition:.2s}
.f input::placeholder{color:#9aa0d8}
.f input:focus{border-color:#5fd4ff;box-shadow:0 0 0 4px rgba(56,189,248,.22),0 0 22px rgba(56,189,248,.3)}
.opt{display:flex;align-items:center;justify-content:space-between;font-size:clamp(13px,1.3vw,16px);color:#dfe2ff}
.opt label{display:flex;align-items:center;gap:10px;cursor:pointer}
.opt input{appearance:none;width:26px;height:26px;border:2px solid #aab0f0;border-radius:6px;background:rgba(10,10,52,.7);cursor:pointer;display:grid;place-items:center}
.opt input:checked{background:linear-gradient(135deg,#a14fe8,#2fb4f5);border-color:#fff}
.opt input:checked:after{content:"✓";font-weight:900;color:#fff;font-size:16px}
.opt a{text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.opt a:hover{color:#fff}
.go{position:relative;appearance:none;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;height:clamp(58px,6.6vw,78px);border-radius:16px;color:#fff;font:900 clamp(20px,2.4vw,32px) var(--kr);letter-spacing:.04em;background:linear-gradient(90deg,#d238e8,#6a4cff 50%,#18b4f5);box-shadow:0 0 0 3px rgba(20,10,80,.6),0 10px 30px rgba(110,70,255,.55);text-shadow:0 2px 0 rgba(40,10,100,.5);transition:transform .15s,filter .2s}
.go:hover{filter:brightness(1.12);transform:translateY(-2px)}
.go:active{transform:translateY(1px)}
.go svg{width:clamp(40px,5vw,60px);height:auto}
.hr{height:2px;background:rgba(160,170,255,.4);margin:2px 0}
.quit{appearance:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;height:clamp(50px,5.4vw,62px);border-radius:16px;border:2px solid rgba(150,140,255,.7);background:rgba(10,10,52,.55);color:#e6e9ff;font:500 clamp(15px,1.6vw,20px) var(--kr)}
.quit:hover{background:rgba(255,255,255,.1)}
.quit svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
#err{min-height:20px;margin:-6px 0 -4px;color:#ff8ab3;font-size:14px;font-weight:500}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pw{display:flex;align-items:center;gap:8px;margin-top:10px}
.pw .fld{flex:1}
.cred{margin-top:14px;padding:16px;border-radius:14px;background:rgba(0,0,0,.3);border:1px dashed rgba(160,170,255,.5);display:none}
.cred.on{display:block}
.cred div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
.cred b{color:#9ee7ff;font-weight:700;word-break:break-all}
#bye{position:fixed;inset:0;z-index:900;display:none;place-items:center;text-align:center;background:#06071f;color:#cfd3ff;font:500 18px var(--kr)}
#bye.on{display:grid}
@media (max-width:860px){
 body{overflow:auto;place-items:start center;padding:14px}
 .body{grid-template-columns:1fr;gap:18px;padding:18px}
 .art{border-right:0;padding:0;border-bottom:2px solid rgba(140,150,255,.35);padding-bottom:12px}
 .art img{max-width:300px}
 form{padding-left:0}
}
@media (max-height:620px) and (min-width:861px){body{overflow:auto;place-items:start center}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="gp" viewBox="0 0 56 36"><path d="M10 4h36c5 0 8 4 9 12l1 11c.4 5-4 8-8 5l-6-5H14l-6 5c-4 3-8 0-8-5l1-11C2 8 5 4 10 4z" fill="#e4d9ff" stroke="#fff" stroke-width="1.500"/><path d="M15 12v10M10 17h10" stroke="#4a35d8" stroke-width="3.500" stroke-linecap="round"/><circle cx="38" cy="14" r="2.500" fill="#ff5a8a"/><circle cx="44" cy="18" r="2.500" fill="#38bdf8"/><circle cx="38" cy="22" r="2.500" fill="#4ade80"/><circle cx="32" cy="18" r="2.500" fill="#fbbf24"/></symbol>
</defs></svg>

<div class="win px">
 <div class="in px">
  <div class="bar"><svg><use href="#gp"/></svg><b>영호의 <span class="g">게임에뮬레이터</span></b></div>
  <div class="body">
   <div class="art"><img src="ui/img/login-art.jpg" alt="PRESS START"></div>
   <form id="lf" autocomplete="on">
    <div class="f"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.500"/><path d="M3.500 21c0-4.500 3.800-7 8.500-7s8.500 2.500 8.500 7z"/></svg><input id="id" name="username" type="text" placeholder="아이디를 입력하세요..." autocomplete="username" autocapitalize="off" spellcheck="false"></div>
    <div class="f"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1.500A1.500 1.500 0 0 1 20 11.500v9a1.500 1.500 0 0 1-1.500 1.500h-13A1.500 1.500 0 0 1 4 20.500v-9A1.500 1.500 0 0 1 5.500 10zm2 0h6V7a3 3 0 0 0-6 0z"/></svg><input id="pw" name="password" type="password" placeholder="비밀번호를 입력하세요..." autocomplete="current-password"></div>
    <div class="opt"><label><input type="checkbox" id="keep">로그인 상태 유지</label><a id="find">비밀번호 찾기</a></div>
    <div id="err" role="alert"></div>
    <button class="go" type="submit"><svg viewBox="0 0 56 36"><use href="#gp"/></svg>로그인</button>
    <div class="hr"></div>
    <button class="quit" type="button" id="quit"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.500 6.500a8 8 0 1 0 11 0"/></svg>종료하기</button>
   </form>
  </div>
 </div>
</div>

<div class="modal" id="mFind"><div class="mbox">
 <h3>비밀번호 찾기</h3>
 <p>GitHub 토큰으로 사이트 주인인지 확인한 뒤, 설정된 아이디와 비밀번호를 보여드려요. (토큰은 이 확인에만 쓰이고 저장되지 않아요)</p>
 <div class="pw"><input class="fld" id="tok" type="password" placeholder="GitHub 토큰 (ghp_… / github_pat_…)" autocomplete="off"></div>
 <p id="tmsg" style="min-height:22px;margin:8px 0 0;font-size:13.5px"></p>
 <div class="cred" id="cred"><div><span>아이디</span><b id="cId"></b></div><div><span>비밀번호</span><b id="cPw"></b></div></div>
 <div class="row"><button class="gbtn" type="button" id="fClose">닫기</button><button class="pbtn" type="button" id="fOk">토큰 확인</button></div>
</div></div>

<div id="bye"><div>👋 이용해 주셔서 감사합니다.<br><small>이 창(탭)을 닫아 주세요.</small><br><br><button class="pbtn" onclick="location.reload()">다시 시작</button></div></div>

<script src="ui/core.js"></script>
<script>
(function(){
 var q=YH.qs,$=function(i){return document.getElementById(i)};
 var suffix=q.get('m')==='1'?'?m=1':(q.get('pc')==='1'?'?pc=1':'');
 if(YH.authed()&&!q.has('relogin')){location.replace('home.html'+suffix);return}
 $('lf').addEventListener('submit',function(e){
  e.preventDefault();
  if(YH.login($('id').value.trim(),$('pw').value,$('keep').checked)){
   $('err').textContent='';document.querySelector('.win').style.transition='.35s';document.querySelector('.win').style.opacity='0';
   setTimeout(function(){location.replace('home.html'+suffix)},300);
  }else{
   $('err').textContent='아이디 또는 비밀번호가 올바르지 않아요.';
   var w=document.querySelector('.win');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
   $('pw').select();
  }
 });
 $('quit').onclick=function(){try{window.close()}catch(e){}setTimeout(function(){$('bye').classList.add('on')},150)};
 /* 비밀번호 찾기 : GitHub 토큰 확인 */
 var saved='';try{saved=localStorage.getItem('gh_token')||''}catch(e){}
 function msg(t,bad){var m=$('tmsg');m.textContent=t;m.style.color=bad?'#ff8ab3':'#9ee7ff'}
 $('find').onclick=function(){$('cred').classList.remove('on');$('tok').value=saved;msg(saved?'이 기기에 저장된 토큰이 있어요. [토큰 확인]을 눌러 주세요.':'');$('mFind').classList.add('on')};
 $('fClose').onclick=function(){$('mFind').classList.remove('on');$('tok').value=''};
 $('fOk').onclick=function(){
  var t=$('tok').value.trim();if(!t){msg('토큰을 입력해 주세요.',1);return}
  msg('확인하는 중…');$('cred').classList.remove('on');
  YH.ghFetch('/user',t).then(function(r){
   if(r.status===401)throw new Error('토큰이 올바르지 않아요.');
   if(!r.ok)throw new Error('GitHub 확인에 실패했어요 ('+r.status+')');
   return r.json();
  }).then(function(u){
   if(String(u.login).toLowerCase()!==YH.REPO.o.toLowerCase())throw new Error('이 사이트 주인의 토큰이 아니에요.');
   return YH.ghFetch('/repos/'+YH.REPO.o+'/'+YH.REPO.r,t).then(function(r){
    if(!r.ok)throw new Error('저장소를 확인할 수 없어요 ('+r.status+')');return r.json();
   });
  }).then(function(rp){
   if(rp.permissions&&rp.permissions.push===false&&rp.permissions.admin===false)throw new Error('이 저장소에 쓰기 권한이 있는 토큰이 필요해요.');
   var c=YH.cred();$('cId').textContent=c.id;$('cPw').textContent=c.pw;$('cred').classList.add('on');
   msg('✅ 확인되었어요. 아래 정보로 로그인하세요.');$('tok').value='';
  }).catch(function(e){msg(e.message||'확인하지 못했어요.',1)});
 };
 $('tok').addEventListener('keydown',function(e){if(e.key==='Enter')$('fOk').click()});
 $('mFind').addEventListener('click',function(e){if(e.target===this)$('fClose').click()});
})();
</script>
</body>
</html>
