<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a45">
<link rel="manifest" href="manifest.webmanifest">
<title>영호의 게임에뮬레이터 · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#eef0ff;background:#06063f url(assets/login-bg.jpg) center bottom/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:16px;min-height:100dvh}
.win{width:min(940px,100%);border:3px solid #1a1d6e;border-radius:10px;overflow:hidden;background:#0c0b52;box-shadow:0 0 0 2px #6d6dff,0 0 40px rgba(110,90,255,.55),0 30px 80px rgba(0,0,10,.6);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.tb{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(90deg,#5b2fd6,#2a49d8 60%,#2a79e6);border-bottom:3px solid #1a1d6e;font-weight:900;font-size:18px;letter-spacing:-.3px}
.tb svg{width:34px;height:24px}
.tb b{background:linear-gradient(90deg,#ff7be5,#7bd7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.body{display:grid;grid-template-columns:1fr 1.05fr;position:relative;background:url(assets/panel-bg.jpg) center/cover}
.body::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,60,.35),rgba(6,5,60,.62))}
.body>*{position:relative}
.art{display:flex;align-items:center;justify-content:center;padding:28px 18px;border-right:2px solid rgba(140,150,255,.35)}
.art svg{width:min(330px,100%);height:auto;filter:drop-shadow(0 10px 22px rgba(80,120,255,.45));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.blink{animation:bk 1.1s steps(2) infinite}@keyframes bk{50%{opacity:.25}}
form{padding:34px 34px 30px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.f{display:flex;align-items:center;gap:12px;background:rgba(14,12,70,.78);border:2px solid #6b7bff;border-radius:12px;padding:0 14px;height:54px;transition:.2s}
.f:focus-within{border-color:#9fb0ff;box-shadow:0 0 0 3px rgba(120,140,255,.35),0 0 18px rgba(110,130,255,.5)}
.f svg{width:22px;height:22px;flex:none;color:#b9c3ff}
.f input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-weight:500;font-size:16px;font-family:inherit}
.f input::placeholder{color:#9aa4e8}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
.row label{display:flex;align-items:center;gap:9px;cursor:pointer;color:#dfe3ff}
.row input{width:20px;height:20px;accent-color:#7a5cff}
.lnk{background:none;border:0;color:#cfd6ff;text-decoration:underline;cursor:pointer;font:inherit;padding:4px}
.btn{height:54px;border-radius:12px;border:2px solid #b7c4ff;font-weight:900;font-size:20px;font-family:inherit;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s}
.btn.go{background:linear-gradient(90deg,#9a3cff,#3b6bff 60%,#2fb4ff);box-shadow:0 6px 0 #2a2f9c,0 0 24px rgba(110,110,255,.55)}
.btn.go:hover{filter:brightness(1.12)}.btn.go:active{transform:translateY(4px);box-shadow:0 2px 0 #2a2f9c}
.btn.ex{height:46px;font-size:16px;font-weight:700;background:rgba(14,12,70,.6);border-color:#5f6fe0;color:#dfe3ff}
.btn.ex:hover{background:rgba(40,40,130,.7)}
hr{border:0;border-top:2px solid rgba(140,150,255,.35);margin:2px 0}
.err{min-height:20px;color:#ff9bb0;font-size:13.5px;font-weight:500;text-align:center}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.mask{position:fixed;inset:0;background:rgba(2,2,30,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.mask.on{display:flex}
.card{width:min(460px,100%);background:url(assets/panel-bg.jpg) center/cover;border:3px solid #6d6dff;border-radius:14px;box-shadow:0 0 34px rgba(110,100,255,.6);overflow:hidden}
.card .in{background:rgba(8,6,62,.84);padding:22px}
.card h2{margin:0 0 6px;font-size:19px}
.card p{margin:6px 0;font-size:13.5px;line-height:1.6;color:#cdd3ff}
.card .f{height:48px;margin:12px 0}
.card .btn{height:48px;font-size:16px;flex:1}
.acts{display:flex;gap:8px}
.res{display:none;margin-top:12px;background:rgba(20,18,100,.8);border:2px solid #4fd1a5;border-radius:12px;padding:12px 14px}
.res.on{display:block}
.res div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.res b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;color:#a8ffd9;word-break:break-all}
.res button{background:#2b2f9c;color:#fff;border:1px solid #7a86ff;border-radius:8px;padding:4px 10px;font-size:12px;font-family:inherit;cursor:pointer}
@media(max-width:720px){.body{grid-template-columns:1fr}.art{border-right:0;border-bottom:2px solid rgba(140,150,255,.35);padding:16px}.art svg{width:min(190px,56vw)}form{padding:22px 20px 24px}.tb{font-size:16px}}
</style>
<link rel="stylesheet" href="pixel.css">
</head>
<body>
<div class="win" id="win">
 <div class="tb">
  <svg viewBox="0 0 34 24" fill="none"><rect x="1" y="3" width="32" height="18" rx="9" fill="#e9e5ff" stroke="#fff"/><path d="M8 12h6M11 9v6" stroke="#4a3bd0" stroke-width="2.4"/><circle cx="23" cy="9.5" r="1.8" fill="#ff5a5a"/><circle cx="27" cy="12.5" r="1.8" fill="#37c871"/><circle cx="23" cy="15.5" r="1.8" fill="#3a8bff"/><circle cx="19.5" cy="12.5" r="1.8" fill="#ffc83a"/></svg>
  <span>영호의 <b>게임에뮬레이터</b></span>
 </div>
 <div class="body">
  <div class="art">
   <svg viewBox="0 0 330 270" aria-label="PRESS START">
    <defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9d4ff"/><stop offset="1" stop-color="#a49ce0"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3fd3ff" stop-opacity=".55"/><stop offset="1" stop-color="#3fd3ff" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="165" cy="238" rx="150" ry="22" fill="url(#gl)"/>
    <rect x="36" y="178" width="212" height="56" rx="8" fill="url(#m)" stroke="#7d74c9" stroke-width="3"/>
    <rect x="52" y="200" width="92" height="9" rx="3" fill="#6a62b4"/><rect x="52" y="214" width="92" height="5" rx="2" fill="#7d74c9"/><rect x="220" y="196" width="14" height="14" rx="3" fill="#4cf0a0"/>
    <rect x="58" y="22" width="190" height="162" rx="16" fill="url(#m)" stroke="#7d74c9" stroke-width="3"/>
    <rect x="74" y="38" width="158" height="118" rx="10" fill="#07063c" stroke="#5b8cff" stroke-width="3"/>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="900" font-size="31" fill="#53e1ff" text-anchor="middle" style="filter:drop-shadow(0 0 6px #35c7ff)"><text x="148" y="90">PRESS</text><text x="148" y="126" class="blink">START</text></g>
    <path d="M210 52c-3-5-10-1-6 4l6 6 6-6c4-5-3-9-6-4z" fill="#ff4d6d"/>
    <rect x="68" y="166" width="6" height="6" fill="#ff7bd5"/><rect x="82" y="166" width="6" height="6" fill="#53e1ff"/><rect x="96" y="166" width="6" height="6" fill="#ffd34d"/>
    <g transform="translate(168 168)"><rect width="140" height="70" rx="35" fill="#ece9ff" stroke="#9a92d6" stroke-width="3"/>
     <path d="M30 35h26M43 22v26" stroke="#3e3a8a" stroke-width="9" stroke-linecap="round"/>
     <circle cx="102" cy="22" r="7" fill="#3a8bff"/><circle cx="116" cy="35" r="7" fill="#ff5a5a"/><circle cx="102" cy="48" r="7" fill="#37c871"/><circle cx="88" cy="35" r="7" fill="#ffc83a"/>
     <rect x="62" y="40" width="16" height="6" rx="3" fill="#9a92d6" transform="rotate(-20 70 43)"/></g>
   </svg>
  </div>
  <form id="f" autocomplete="on">
   <div class="f"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.6-4.6 4-7 8.5-7s7.9 2.4 8.5 7z"/></svg><input id="id" name="username" placeholder="아이디를 입력하세요..." autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
   <div class="f"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 10V8a6 6 0 0 1 12 0v2h1.5A1.5 1.5 0 0 1 21 11.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20.5v-9A1.5 1.5 0 0 1 4.5 10zm2.5 0h7V8a3.5 3.5 0 0 0-7 0z"/></svg><input id="pw" name="password" type="password" placeholder="비밀번호를 입력하세요..." autocomplete="current-password" required></div>
   <div class="row"><label><input type="checkbox" id="keep"> 로그인 상태 유지</label><button type="button" class="lnk" id="forgot">비밀번호 찾기</button></div>
   <div class="err" id="err" role="alert"></div>
   <button class="btn go" type="submit">🎮 로그인</button>
   <hr>
   <button class="btn ex" type="button" id="quit">⏻ 종료하기</button>
  </form>
 </div>
</div>

<div class="mask" id="mask">
 <div class="card"><div class="in">
  <h2>🔑 비밀번호 찾기</h2>
  <p>이 사이트 주인(@<span id="own"></span>)의 <b>GitHub 토큰</b>을 확인한 뒤 아이디와 비밀번호를 보여드려요.</p>
  <p style="font-size:12.5px;color:#aab3f5">GitHub → Settings → Developer settings → Personal access tokens 에서 만든 토큰이에요. 권한(scope)은 하나도 체크하지 않아도 됩니다. 토큰은 GitHub 확인에만 쓰이고 저장되지 않아요.</p>
  <div class="f"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14a5 5 0 1 1 4.9-6H22v4h-2v3h-3v-3h-5.1A5 5 0 0 1 7 14zm0-7.5A2.5 2.5 0 1 0 7 11.5 2.5 2.5 0 0 0 7 6.5z"/></svg><input id="tk" type="password" placeholder="ghp_xxxxxxxx 또는 github_pat_xxxx" autocomplete="off" spellcheck="false"></div>
  <div class="err" id="terr"></div>
  <div class="res" id="res"><div><span>아이디</span><b id="rid"></b><button type="button" data-c="rid">복사</button></div><div><span>비밀번호</span><b id="rpw"></b><button type="button" data-c="rpw">복사</button></div></div>
  <div class="acts" style="margin-top:12px"><button class="btn ex" type="button" id="tcl">닫기</button><button class="btn go" type="button" id="tok" style="box-shadow:none">토큰 확인</button></div>
 </div></div>
</div>

<script src="auth.js"></script>
<script>
(function(){
 var $=function(i){return document.getElementById(i)};
 if(new URLSearchParams(location.search).has('logout'))Auth.logout();
 else if(Auth.ok()){location.replace('home.html');return}
 $('own').textContent=Auth.OWNER;
 $('f').onsubmit=function(e){
  e.preventDefault();
  if(Auth.login($('id').value,$('pw').value,$('keep').checked)){location.replace('home.html');return}
  $('err').textContent='아이디 또는 비밀번호가 올바르지 않아요.';
  var w=$('win');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');$('pw').select();
 };
 $('quit').onclick=function(){
  window.close();
  setTimeout(function(){location.href='about:blank'},250);
 };
 var m=$('mask');
 $('forgot').onclick=function(){m.classList.add('on');$('res').classList.remove('on');$('terr').textContent='';setTimeout(function(){$('tk').focus()},50)};
 $('tcl').onclick=function(){m.classList.remove('on');$('tk').value=''};
 m.onclick=function(e){if(e.target===m)$('tcl').click()};
 function check(){
  var b=$('tok');b.disabled=true;b.textContent='확인 중…';$('terr').textContent='';$('res').classList.remove('on');
  Auth.recover($('tk').value).then(function(r){
   $('rid').textContent=r.id;$('rpw').textContent=r.pw;$('res').classList.add('on');$('tk').value='';
  }).catch(function(e){
   $('terr').textContent=(e&&e.message&&e.message!=='Failed to fetch')?e.message:'GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  }).then(function(){b.disabled=false;b.textContent='토큰 확인'});
 }
 $('tok').onclick=check;
 $('tk').onkeydown=function(e){if(e.key==='Enter')check()};
 document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){
  var t=$(b.dataset.c).textContent;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='복사됨'}).catch(function(){b.textContent='길게 눌러 복사'});
  setTimeout(function(){b.textContent='복사'},1400);
 }});
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
