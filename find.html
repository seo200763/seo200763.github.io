<!DOCTYPE html>
<html lang="ko" data-dev="pc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d33">
<title>게임찾기 · 영호의 게임에뮬레이터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="ui/common.css">
<link rel="stylesheet" href="ui/pages.css">
</head>
<body>
<header class="hd"><button class="back" onclick="history.length>1?history.back():location.href='home.html'" aria-label="뒤로"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button><h1>게임찾기</h1><span class="sp"></span></header>
<main class="pg">
 <div class="bigq"><input id="q" type="search" placeholder="게임기·게임 이름을 입력하세요 (예: 닌텐도, 마리오)" autocomplete="off"><button class="sgo" id="go" aria-label="검색"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button></div>
 <p class="hint">두 글자 이상 입력하면 검색 아이콘이 나타나요</p>
 <h2 class="shd" id="h1">게임기 종류</h2><div class="sg" id="sg"></div>
 <div id="gr" style="display:none"><h2 class="shd">게임 검색 결과</h2><div class="gl" id="gl"></div></div>
 <div class="tabpad"></div>
</main>
<script src="ui/core.js"></script><script src="ui/shell.js"></script>
<script>
YH.guard();Shell.init('find');
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'')}
function renderSys(q){
 var sg=document.getElementById('sg'),n=norm(q),words=String(q).toLowerCase().split(/\s+/).filter(Boolean);
 var list=YH.SYS.filter(function(s){
  if(!n)return true;var hay=norm(s.n+' '+s.s+' '+s.kw);
  return words.every(function(w){return hay.indexOf(w)>=0})||hay.indexOf(n)>=0;
 });
 sg.innerHTML='';
 document.getElementById('h1').textContent=n?('게임기 검색 결과 '+list.length+'개'):'게임기 종류';
 list.forEach(function(s){
  var d=document.createElement('div');d.className='cd';
  d.innerHTML='<div class="im"><img src="'+s.img+'" alt=""></div><b>'+YH.esc(s.n)+'<small>('+YH.esc(s.s)+')</small></b><button class="heart '+(YH.Fav.hasSys(s.id)?'on':'')+'">'+YH.HEART+'</button>';
  d.onclick=function(e){if(e.target.closest('.heart'))return;YH.openSys(s)};
  d.querySelector('.heart').onclick=function(e){e.stopPropagation();this.classList.toggle('on',YH.Fav.toggleSys(s.id))};
  sg.appendChild(d);
 });
 if(!list.length){sg.innerHTML='<div class="empty" style="grid-column:1/-1">찾는 게임기가 없어요.</div>'}
}
var seq=0;
function renderGames(q){
 var box=document.getElementById('gr'),gl=document.getElementById('gl'),my=++seq;
 if(norm(q).length<2){box.style.display='none';return}
 Promise.all(YH.SYS.filter(function(s){return s.kind!=='win'}).map(function(s){return YH.games(s).then(function(r){return{s:s,items:r.items}}).catch(function(){return{s:s,items:[]}})})).then(function(all){
  if(my!==seq)return;
  var n=q.toLowerCase().split(/\s+/).filter(Boolean),hits=[];
  all.forEach(function(a){a.items.forEach(function(g){var h=(g.title+' '+g.file).toLowerCase();if(n.every(function(w){return h.indexOf(w)>=0}))hits.push({s:a.s,g:g})})});
  box.style.display=hits.length?'':'none';gl.innerHTML='';
  hits.slice(0,80).forEach(function(h){
   var d=document.createElement('div');d.className='gc';d.style.setProperty('--c',h.s.a);
   d.innerHTML='<div class="th"><img src="'+h.s.img+'" alt=""></div><div class="tx"><b>'+YH.esc(h.g.title)+'</b><small>'+YH.esc(h.s.n)+(h.g.size?' · '+YH.fmt(h.g.size):'')+'</small></div><span class="pl"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>';
   d.onclick=function(){location.href=YH.playUrl(h.s,h.g.p)};gl.appendChild(d);
  });
 });
}
function run(v){renderSys(v);renderGames(v)}
var inp=document.getElementById('q'),go=document.getElementById('go');
Shell.searchBox(inp,go,run);
inp.addEventListener('input',function(){renderSys(inp.value.trim());if(inp.value.trim().length<2)renderGames('')});
var q0=YH.qs.get('q')||'';inp.value=q0;inp.dispatchEvent(new Event('input'));if(q0.length>=2)run(q0);
</script>
</body>
</html>
