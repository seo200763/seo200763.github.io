<!DOCTYPE html>
<html lang="ko" data-dev="pc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14185c">
<title>MS-DOS · 영호의 게임에뮬레이터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="ui/common.css">
<link rel="stylesheet" href="ui/player.css">
</head>
<body>
<div class="pl">
 <div class="pbar"><button class="bk" id="bBack" aria-label="목록으로"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button><div class="t"><img id="tImg" alt=""><span id="tName">MS-DOS</span></div></div>
 <div class="stage"><iframe id="fr" allow="autoplay; fullscreen; gamepad" title="도스 에뮬레이터"></iframe>
  <div class="ov" id="ovLoad"><div class="ovc"><img id="lImg" alt=""><h2 id="lTitle">게임 내려받는 중</h2><div class="pb"><i id="lBar"></i></div><p id="lLine">준비 중…</p></div></div>
  <div class="ov" id="ovErr"><div class="ovc"><img id="eImg" alt=""><h2>게임을 시작하지 못했어요</h2><p id="eMsg"></p><div class="row"><button class="gbtn" id="eBack">목록으로</button></div></div></div>
 </div>
</div>
<script src="ui/core.js"></script>
<script>
(function(){
YH.guard();
var $=function(i){return document.getElementById(i)},S=YH.byId('dos'),P=YH.qs.get('p')||'';
['tImg','lImg','eImg'].forEach(function(i){$(i).src=S.img});
function back(){location.href='games.html?sys=dos'+(YH.qs.get('m')==='1'?'&m=1':'')}
$('bBack').onclick=$('eBack').onclick=back;
var fr=$('fr');fr.src='dosplayer.html';
if(!P)return;
var name=decodeURIComponent(P.split('/').pop());
$('tName').textContent='MS-DOS · '+YH.base(name);$('ovLoad').classList.add('on');
var loaded=new Promise(function(r){fr.addEventListener('load',function(){r()})});
YH.fetchBlob(P.split('/').map(function(x,i){return i?encodeURIComponent(decodeURIComponent(x)):x}).join('/'),function(g,t){$('lBar').style.width=(t?Math.max(3,g/t*90):30)+'%';$('lLine').textContent='내려받는 중… '+YH.fmt(g)+(t?' / '+YH.fmt(t):'')})
 .then(function(b){return loaded.then(function(){return b})})
 .then(function(b){
  var f=new File([b],name,{type:b.type||'application/zip'});
  var w=fr.contentWindow;
  if(typeof w.handleGameFiles!=='function')throw new Error('도스 에뮬레이터(dosplayer.html)를 불러오지 못했어요.');
  $('lBar').style.width='100%';$('lLine').textContent='도스 게임 준비 중…';
  return Promise.resolve(w.handleGameFiles([f])).then(function(){setTimeout(function(){$('ovLoad').classList.remove('on')},500)});
 })
 .catch(function(e){$('ovLoad').classList.remove('on');$('eMsg').textContent=(e&&e.message)||'롬을 불러오지 못했어요';$('ovErr').classList.add('on')});
})();
</script>
</body>
</html>
