<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap"><link rel="stylesheet" href="gw.css"><title>영호의 게임세상 · 로그인</title></head><body><div class="wrap">

<script>
var SALT="689a83b47c22d8db82a6f12091b7b73e",HASH="ac93e308f89f2a7eb9a57000c39b049390acaf0a0cf7e8f9405cefbf4c2d76eb",K="yh_s";
var $=function(s){return document.querySelector(s)};
function go(){var n=new URLSearchParams(location.search).get("next"),u="index.html";try{var x=new URL(n,location.href);if(n&&x.origin===location.origin&&!/login\.html/.test(x.pathname))u=x.href}catch(e){}location.replace(u)}
try{var s0=JSON.parse(sessionStorage.getItem(K));if(s0&&s0.t)go()}catch(e){}
var h2b=function(h){return Uint8Array.from(h.match(/../g).map(function(x){return parseInt(x,16)}))},b2h=function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")};
async function kdf(id,pw){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(id+":"+pw),"PBKDF2",false,["deriveBits"]);return b2h(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:h2b(SALT),iterations:200000},k,256))}

function setlk(v){try{localStorage.setItem("yh_lk",JSON.stringify(v))}catch(e){}}
$("#lf").onsubmit=async function(e){e.preventDefault();var m=$("#lm"),l=lk();
if(l.u>Date.now()){m.textContent=Math.ceil((l.u-Date.now())/1000)+"초 뒤에 다시 시도해주세요.";return}

$("#lb").disabled=true;var d=await kdf($("#u").value.trim(),$("#p").value),x=d.length^HASH.length;for(var i=0;i<HASH.length;i++)x|=(d.charCodeAt(i)||0)^HASH.charCodeAt(i);$("#lb").disabled=false;$("#p").value="";
if(x===0){setlk({n:0,u:0});try{sessionStorage.setItem(K,JSON.stringify({t:b2h(crypto.getRandomValues(new Uint8Array(16))),e:0}))}catch(er){m.textContent="이 브라우저에서는 세션을 저장할 수 없어요.";return}go()}
else{var n=l.n+1;setlk({n:n,u:n>=5?Date.now()+30000*Math.pow(2,Math.min(n-5,6)):0});m.textContent=n>=5?"실패가 많아 잠시 잠겼어요. 잠시 후 다시 시도해주세요.":"아이디 또는 비밀번호가 맞지 않습니다."}};
</script></body></html>
