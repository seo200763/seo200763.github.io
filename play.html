<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>게임</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#game{position:fixed;inset:0}
#bk{position:fixed;left:8px;top:8px;z-index:9;border:0;border-radius:20px;background:#000a;color:#fff;padding:8px 14px;font-size:14px}</style></head><body>
<button id="bk" onclick="history.length>1?history.back():location.href='index.html'">← 목록</button><div id="game"></div>
<script src="common.js"></script><script>
const q=new URLSearchParams(location.search),S=SYS.find(s=>s.id==q.get('sys')),f=q.get('f');
if(!S||!S.core||!f){document.body.innerHTML='<p style="color:#fff;padding:60px 20px">실행할 수 없는 게임입니다.</p>'}else{
 EJS_player='#game';EJS_core=S.core;EJS_gameName=f.replace(/\.[^.]+$/,'');EJS_gameUrl=RAW('ROMFILE/'+S.f+'/'+f);
 EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';EJS_startOnLoaded=true;EJS_language='ko-KR';EJS_color=S.a;
 if(S.id=='neogeo'||S.id=='mame'){EJS_biosUrl=new URL('ROMFILE/NEOGEO/_bios/neogeo.zip',location.href).href}
 if(/desmume/.test(S.core)){EJS_controlScheme='nds';EJS_defaultOptions={desmume_pointer_type:'touch'}}
 if(S.core=='psx')EJS_defaultOptions={pcsx_rearmed_drc:'enabled',pcsx_rearmed_frameskip_type:'auto'};
 const s=document.createElement('script');s.src=EJS_pathtodata+'loader.js';document.body.appendChild(s)}
</script></body></html>
