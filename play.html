<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>게임 실행</title><script src="auth.js"></script>
<style>html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.bar{display:flex;gap:8px;padding:8px;background:#0b1b4a}.bar a,.bar button{font:inherit;color:#fff;background:#1e6bff;border:0;border-radius:10px;padding:8px 14px;text-decoration:none;cursor:pointer}#game,#box{flex:1;min-height:0;position:relative}#box iframe{width:100%;height:100%;border:0;background:#fff}#msg{padding:24px;text-align:center}</style></head><body>
<div class="bar"><a id="back" href="index.html">← 게임목록</a><button id="fs">전체화면</button><a href="index.html">끝내기</a></div><div id="box"><div id="game" style="width:100%;height:100%"></div></div>
<script src="romdata.js"></script><script>
var q=new URLSearchParams(location.search),m=RD.M[q.get("m")],f=q.get("f")||"",box=document.getElementById("box");
function msg(t){box.innerHTML='<div id="msg">'+t+'</div>'}
function ld(s,cb){var e=document.createElement("script");e.src=s;e.onload=cb;e.onerror=function(){msg("실행 엔진을 불러오지 못했어요. 인터넷 연결을 확인해주세요.")};document.head.append(e)}
if(!m||!m.f||/[\/]|\.\./.test(f)){location.replace("index.html")}else{
document.getElementById("back").href="roms.html?m="+q.get("m");document.getElementById("fs").onclick=function(){(box.requestFullscreen||box.webkitRequestFullscreen||function(){}).call(box)};
var url="ROMS/"+m.f+"/"+encodeURIComponent(f),name=f.replace(/\.[^.]+$/,"");
if(m.eng==="ejs")(async function(){var bios=null;for(var b of(m.bios||[])){try{if((await fetch(b,{method:"HEAD"})).ok){bios=b;break}}catch(e){}}
window.EJS_player="#game";EJS_core=m.core;EJS_gameUrl=url;EJS_gameName=name;EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";EJS_startOnLoaded=true;if(bios)EJS_biosUrl=bios;ld(EJS_pathtodata+"loader.js")})();
else if(m.eng==="html")box.innerHTML='<iframe src="'+url+'" allow="fullscreen;gamepad"></iframe>';
else if(m.eng==="swf")ld("https://unpkg.com/@ruffle-rs/ruffle",function(){var p=RufflePlayer.newest().createPlayer();p.style.cssText="width:100%;height:100%";box.innerHTML="";box.append(p);p.load(url)});
else if(m.eng==="jsdos")location.replace("dosplay.html?f="+encodeURIComponent(f))
else msg("이 종류는 아직 실행 엔진이 없어요.")}
</script></body></html>
