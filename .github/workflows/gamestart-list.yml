name: Build GAMESTART game catalogue
on:
  push:
    paths:
      - 'GAMESTART/**'
      - 'scripts/build_gamestart.py'
      - '.github/workflows/gamestart-list.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate games.json
        run: python scripts/build_gamestart.py
      - name: Commit catalogue
        run: |
          if ! git diff --quiet -- GAMESTART/games.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add GAMESTART/games.json
            git commit -m "Update GAMESTART game catalogue [skip ci]"
            git push
          fi
