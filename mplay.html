<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#05043d">
<title>게임 실행 (모바일)</title>
<script src="auth.js"></script><script>Auth.guard()</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color:#fff}
#bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left));background:linear-gradient(180deg,rgba(8,6,70,.96),rgba(8,6,70,.82));border-bottom:1px solid #4a58f0;transition:transform .25s}
#bar.min{transform:translateY(-100%)}
#bar button{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid #5560e8;background:rgba(40,40,150,.7);color:#fff;font-size:15px}
#bar button:disabled{opacity:.35}#bar button:active{background:#5b4de8}
#ttl{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#tab{position:fixed;right:10px;top:calc(6px + env(safe-area-inset-top));z-index:21;width:34px;height:34px;border-radius:50%;border:1px solid #5560e8;background:rgba(10,8,86,.75);color:#fff;font-size:15px;display:none}
#bar.min~#tab{display:block}
#fr{position:fixed;left:0;right:0;bottom:0;top:calc(48px + env(safe-area-inset-top));width:100%;height:calc(100% - 48px - env(safe-area-inset-top));border:0;background:#000;transition:top .25s,height .25s}
#bar.min~#fr{top:0;height:100%}
#ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#1b1a6a,#05043d 75%)}
#ov.off{display:none}
.cd{width:min(420px,100%);text-align:center;background:rgba(20,18,110,.7);border:2px solid #6b7bff;border-radius:20px;padding:24px 20px;box-shadow:0 0 30px rgba(100,100,255,.4)}
.cd img{width:110px;height:110px;object-fit:contain}.cd h2{margin:6px 0;font-size:18px}.cd p{margin:6px 0;font-size:13.5px;line-height:1.6;color:#cfd4ff;white-space:pre-line}
.pb{height:12px;border-radius:9px;background:#0a0a50;border:1px solid #4a58f0;overflow:hidden;margin:14px 0 4px}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a855f7,#3b82f6,#22d3ee);transition:width .2s}
.cd .b{display:inline-block;margin:10px 4px 0;padding:11px 20px;border-radius:99px;border:0;background:linear-gradient(90deg,#8b5cf6,#3b82f6);color:#fff;font-weight:700;font-size:15px;font-family:inherit}
.cd .b.g{background:rgba(60,60,160,.7);border:1px solid #6b7bff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;background:rgba(8,6,80,.95);border:1px solid #6b7bff;border-radius:99px;padding:9px 16px;font-size:13px;z-index:60;display:none;text-align:center}
</style>
</head>
<body>
<div id="bar">
 <button id="back" aria-label="목록으로">‹</button><span id="ttl"></span>
 <button id="bCore" style="display:none">🧩</button><button id="bSave" disabled title="상태 저장">💾</button><button id="bLoad" disabled title="상태 불러오기">📥</button><button id="bCtl" disabled title="조작 버튼 숨김/표시">🎮</button><button id="bHide" title="메뉴 숨기기">▲</button>
</div>
<button id="tab" aria-label="메뉴 열기">▼</button>
<iframe id="fr" allow="autoplay; gamepad; fullscreen" title="game"></iframe>
<div id="ov"><div class="cd"><img id="ovi" alt=""><h2 id="ovt">준비 중…</h2><div class="pb" id="pb"><i id="pi"></i></div><p id="ovm"></p><div id="ovb"></div></div></div>
<input type="file" id="fi" hidden><input type="file" id="fs" hidden accept=".gsv,.state,.bin">
<div id="toast"></div>
<script src="gamehub.js"></script><script src="mamegame.js"></script><script src="loadgame.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},H=Hub,q=new URLSearchParams(location.search);
var sys=H.byId(q.get('sys')),fr=$('fr'),seq=0,watchT=0,started=false,lastFile=null,curCi=0,lastErr='';
var UA=navigator.userAgent||'',IOSD=/Macintosh/.test(UA)&&(navigator.maxTouchPoints||0)>1;
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2200)}
window.toast=toast;
function back(){location.href='home.html#/'+(sys?'sys/'+sys.id:'')}
$('back').onclick=back;
if(!sys||sys.os){back();return}
$('ovi').src=sys.icon;$('ttl').textContent=sys.n;
var list=[sys.core].concat(sys.alt||[]);
if(list.length>1&&(sys.id==='mame'||sys.id==='nds'))$('bCore').style.display='';
function ov(t,m,pct,btns){
 $('ov').classList.remove('off');$('ovt').textContent=t;$('ovm').textContent=m||'';
 $('pb').style.display=pct==null?'none':'';if(pct!=null)$('pi').style.width=pct+'%';
 var b=$('ovb');b.innerHTML='';(btns||[]).forEach(function(x){var e=document.createElement('button');e.className='b'+(x.g?' g':'');e.textContent=x.t;e.onclick=x.f;b.appendChild(e)});
}
function fail(msg,title){seq++;clearTimeout(watchT);fr.onload=null;fr.src='about:blank';ov(title||'게임을 시작하지 못했어요',msg,null,[{t:'다시 시도',f:function(){location.reload()}},{t:'목록으로',g:1,f:back}])}
function pick(){
 ov('내 기기의 게임 파일','내 기기에 있는 '+sys.n+' 게임 파일을 선택하세요.\n형식: '+sys.ext,null,[{t:'📂 파일 선택',f:function(){$('fi').click()}},{t:'목록으로',g:1,f:back}]);
}
$('fi').onchange=function(){var f=this.files[0];if(!f)return;ov('파일 준비 중…',f.name,40);
 (sys.id==='mame'?MG.prepare(f):Promise.resolve(f)).then(function(x){start(x,0)})};
function init(){
 var f=q.get('f');
 if(!f){pick();return}
 $('ttl').textContent=f.replace(/\.[^.]+$/,'');
 ov('게임 파일 내려받는 중…',f,0);
 H.getRom(sys,q.get('d'),f,function(g,t){var p=t?Math.min(55,g/t*55):30;ov('게임 파일 내려받는 중…',H.fmtSize(g)+(t?' / '+H.fmtSize(t):''),p)})
  .then(function(file){start(file,0)}).catch(function(e){fail(e.message+'\n파일 이름과 폴더('+sys.dir[0]+')를 확인해 주세요.','불러오기 실패')});
}
function start(file,ci,lvl){
 lastFile=file;curCi=ci;started=false;var my=++seq;clearTimeout(watchT);
 var isPs=sys.id==='psx',isMame=sys.id==='mame',core=list[ci],hasNext=ci+1<list.length;
 var plv=lvl==null?LoadGame.autoLevel():lvl,name=file.name.replace(/\.[^.]+$/,'');
 if(isPs){var bad=LoadGame.badFormat(file);if(bad){fail(bad,'파일 형식 확인');return}}
 if(isMame)$('bCore').textContent='🧩 '+MG.coreName(core);else $('bCore').textContent='🧩';
 ov('에뮬레이터 준비 중…',(isPs?'플레이스테이션은 시작까지 시간이 걸릴 수 있어요.\n':'')+name,60);
 var tryNext=function(){if(my!==seq||started||!hasNext)return false;clearTimeout(watchT);fr.onload=null;toast('다른 코어로 다시 시도합니다…');start(file,ci+1);return true};
 fr.onload=function(){
  fr.onload=null;if(my!==seq)return;var w;
  try{w=fr.contentWindow;if(!w||typeof w.startEmu!=='function')throw 0}catch(e){fail('에뮬레이터 화면(emuhost.html)을 불러오지 못했습니다.\nemuhost.html 이 사이트에 같이 올라갔는지 확인해 주세요.');return}
  if(isMame)MG.hook(w);
  var psxFail=function(m){if(my!==seq||started)return;if(plv<2){clearTimeout(watchT);toast('저사양 안전 모드로 다시 시도합니다…');start(file,ci,2);return}fail(LoadGame.explain(),'불러오기 실패')};
  if(isPs)LoadGame.watchError(w,function(){return my===seq&&!started},psxFail);
  try{w.startEmu({
   bios:file.mgBios||[],file:file,core:core,name:name,color:sys.a,spoofMobile:IOSD,psxOpts:isPs?LoadGame.psxOptions(plv):null,
   onScript:function(){if(my===seq&&!started)ov('에뮬레이터 준비 중…','엔진 다운로드 완료 · 게임 코어 준비 중…',80)},
   onScriptError:function(){fail('에뮬레이터 엔진을 불러오지 못했습니다. 인터넷 연결을 확인하세요.','연결 오류')},
   onFail:function(m){
    lastErr=m;if(isPs&&/failed to (start|load|initialize)/i.test(m)){psxFail(m);return}
    if(hasNext&&!/out of memory|RangeError/i.test(m)&&/abort|wasm|WebAssembly|runtime|unreachable|core/i.test(m)){if(tryNext())return}
    if(/out of memory|memory|allocat|Aborted|RangeError|WebAssembly/i.test(m))fail('기기 메모리가 부족해 이 게임을 열 수 없어요. 다른 탭·앱을 닫고 다시 시도하거나 용량이 작은 게임을 선택해 보세요.\n('+m.slice(0,80)+')','메모리 부족');
   },
   onStart:function(){if(my!==seq)return;started=true;clearTimeout(watchT);$('ov').classList.add('off');['bSave','bLoad','bCtl'].forEach(function(i){$(i).disabled=false});toast('게임 시작! 🎮');setTimeout(function(){$('bar').classList.add('min')},2500)}
  })}catch(err){fail('에뮬레이터 준비 실패: '+err.message)}
 };
 fr.src='emuhost.html?v='+Date.now();
 watchT=setTimeout(function(){if(tryNext())return;fail((isPs?LoadGame.TOO_LONG+'\n':'게임 시작이 너무 오래 걸립니다.\n')+'게임 파일이 이 기종에 맞는지 확인하고, 용량이 작은 파일로 다시 시도해 보세요.'+(lastErr?'\n('+lastErr.slice(0,80)+')':''),'시작 지연')},isPs?LoadGame.waitMs(file.size):(hasNext?180000:300000));
}
$('bCore').onclick=function(){if(lastFile){toast('🧩 다른 코어로 다시 시작합니다…');start(lastFile,(curCi+1)%list.length)}};
$('bHide').onclick=function(){$('bar').classList.add('min')};$('tab').onclick=function(){$('bar').classList.remove('min')};
$('bCtl').onclick=function(){try{fr.contentDocument.body.classList.toggle('hidectl')}catch(e){}};
$('bSave').onclick=function(){
 try{
  var st=fr.contentWindow.EJS_emulator.gameManager.getState(),n=new Date(),p=function(v){return String(v).padStart(2,'0')};
  var g=(lastFile.name.replace(/\.[^.]+$/,'')).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,14)||'GAME';
  var nm=sys.fn+g+'_'+p(n.getMonth()+1)+p(n.getDate())+p(n.getHours())+p(n.getMinutes())+'.GSV';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([st]));a.download=nm;document.body.appendChild(a);a.click();a.remove();toast('💾 저장됨: '+nm);
 }catch(e){toast('지금은 저장할 수 없어요')}
};
$('bLoad').onclick=function(){$('fs').click()};
$('fs').onchange=function(){var f=this.files[0];if(!f)return;f.arrayBuffer().then(function(b){try{fr.contentWindow.EJS_emulator.gameManager.loadState(new Uint8Array(b));toast('📥 불러옴: '+f.name)}catch(e){toast('불러오지 못했어요')}});this.value=''};
init();
})();
</script>
</body>
</html>
