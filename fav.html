<!DOCTYPE html>
<html lang="ko" data-dev="pc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d33">
<title>즐겨찾기 · 영호의 게임에뮬레이터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="ui/common.css">
<link rel="stylesheet" href="ui/pages.css">
</head>
<body>
<header class="hd"><button class="back" onclick="history.length>1?history.back():location.href='home.html'" aria-label="뒤로"><svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg></button><h1>즐겨찾기</h1><span class="sp"></span></header>
<main class="pg"><h2 class="shd">게임기</h2><div class="sg" id="sg"></div><h2 class="shd">게임</h2><div class="gl" id="gl"></div><div class="tabpad"></div></main>
<script src="ui/core.js"></script><script src="ui/shell.js"></script>
<script>
YH.guard();Shell.init('fav');
function draw(){
 var sg=document.getElementById('sg'),gl=document.getElementById('gl');sg.innerHTML='';gl.innerHTML='';
 var fs=YH.Fav.sys().map(YH.byId).filter(Boolean).filter(YH.visible);
 fs.forEach(function(s){
  var d=document.createElement('div');d.className='cd';
  d.innerHTML='<div class="im"><img src="'+s.img+'" alt=""></div><b>'+YH.esc(s.n)+'<small>('+YH.esc(s.s)+')</small></b><button class="heart on">'+YH.HEART+'</button>';
  d.onclick=function(e){if(e.target.closest('.heart'))return;YH.openSys(s)};
  d.querySelector('.heart').onclick=function(e){e.stopPropagation();YH.Fav.toggleSys(s.id);draw()};
  sg.appendChild(d);
 });
 if(!fs.length)sg.innerHTML='<div class="empty" style="grid-column:1/-1">홈에서 게임기의 ♡ 를 눌러 담아 보세요.</div>';
 var fg=YH.Fav.games();
 fg.forEach(function(g){
  var s=YH.byId(g.sys);if(!s||!YH.visible(s))return;
  var d=document.createElement('div');d.className='gc';d.style.setProperty('--c',s.a);
  d.innerHTML='<div class="th"><img src="'+s.img+'" alt=""></div><div class="tx"><b>'+YH.esc(g.t)+'</b><small>'+YH.esc(s.n)+'</small></div><button class="heart on">'+YH.HEART+'</button><span class="pl"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>';
  d.onclick=function(e){if(e.target.closest('.heart'))return;location.href=YH.playUrl(s,g.p)};
  d.querySelector('.heart').onclick=function(e){e.stopPropagation();YH.Fav.toggleGame(g);draw()};
  gl.appendChild(d);
 });
 if(!fg.length)gl.innerHTML='<div class="empty">게임 목록에서 게임의 ♡ 를 눌러 담아 보세요.</div>';
}
draw();
</script>
</body>
</html>
